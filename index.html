<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC Parts Store</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo">PC PARTS STORE</div>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#products">Products</a></li>
        <li><a href="#about">About</a></li>
      </ul>
    </nav>

    <!-- Section Home -->
    <section id="home" class="hero-section">
      <div class="hero-banner">
        <h1>Upgrade PC, Maksimalkan <span class="highlight">Performa.</span></h1>
      </div>
    </section>

    <!-- Section Products / Collections -->
    <section id="products" class="products-section">
      <h2>Products</h2>
      <div class="product-grid">
        <div class="product-card">
          <img src="https://images.unsplash.com/photo-1597872200969-2b65d56bd16b?auto=format&fit=crop&w=300&q=80" alt="SSD" />
          <p>SSD</p>
        </div>
        <div class="product-card">
          <img src="https://images.unsplash.com/photo-1562976540-1502c2145186?auto=format&fit=crop&w=300&q=80" alt="RAM" />
          <p>RAM</p>
        </div>
        <div class="product-card">
          <img src="https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?auto=format&fit=crop&w=300&q=80" alt="Prosesor" />
          <p>Prosesor</p>
        </div>
        <div class="product-card">
          <img src="https://images.unsplash.com/photo-1587202372775-e229f172b9d7?auto=format&fit=crop&w=300&q=80" alt="Kartu Grafis" />
          <p>Kartu Grafis</p>
        </div>
      </div>
    </section>

    <!-- Section About -->
    <section id="about" class="about-section">
      <h2>About</h2>
      <p>Pilihan komponen untuk kebutuhan upgrade PC kamu.</p>
    </section>
  </body>
</html>

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - PC Parts Store</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-body">
    <div class="login-card">
      <h2>PC Parts Store</h2>
      <p class="subtitle">solusi terbaik online komponen PC</p>

      <form action="index.html" method="get">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="ketik username" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="ketik password" required />
        </div>

        <button type="submit" class="btn-masuk">Masuk</button>
      </form>
    </div>
  </body>
</html>
